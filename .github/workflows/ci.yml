name: CI
on:
  push:
    # ai-yorum: yapay zekâ yorumcusunun kayıt dalı (yalnız JSON), derlenecek bir şey yok
    branches-ignore: ["ai-yorum"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
