# Render statik site: https://render.com (ücretsiz). Blueprint olarak içe aktarılabilir.
services:
  - type: web
    name: grafik
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
